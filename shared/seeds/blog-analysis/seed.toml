# Describe this archetype for the repo-seed skill
archetype = "blog-analysis"

[axes]
purpose = "blog-analysis"
language = "python"
env_manager = "detect"  # Resolve from repository signals or the user's answer

# Render these rules from paths relative to shared/rules
rules = [
    "lang/python/core.md",
    "lang/python/testing.md",
    "lang/python/docs.md",
    "lang/python/packaging.md",
    "lang/python/security.md",
    "prose/writing-conventions.md",
]
