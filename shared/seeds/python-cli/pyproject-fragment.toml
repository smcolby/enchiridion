# Merge these gates into the repository's pyproject.toml
# Keep enforced directives out of duplicated rule prose

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "PT", "PTH", "S", "D", "TID"]

# Allow undocumented magic methods, fixed argument subprocesses, and portable commands
ignore = ["D105", "D107", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.TestCase".msg = "Use plain pytest functions (python-testing rule)"

[tool.ruff.lint.per-file-ignores]

# Allow assertions and omit API docstrings in tests
"tests/**" = ["S101", "D"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
