[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enchiridion"
version = "0.1.0"
description = "Cross-harness AI coding-assistant configuration manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
enchiridion = "enchiridion.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pyright>=1.1.410",
    "pytest>=8.0",
    "ruff>=0.15.14",
]

[tool.hatch.build.targets.wheel]
packages = ["enchiridion"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH", "PT", "S", "D"]
# S603/S607: these tools orchestrate git, python, and npx by fixed argv
# (no shell, no untrusted input); the partial paths are intentional for
# PATH portability. All other bandit checks stay active.
# D105/D107: docstrings not required on magic methods or __init__.
ignore = ["S603", "S607", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test modules use assertions and behavior-first names instead of API docstrings
"tests/**/*.py" = ["S101", "D"]
# The rule exemplar test module gets the same relaxations seeded repos give tests/
"shared/rules/**/examples/test_*.py" = ["S101", "D"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["enchiridion", "tools"]
