[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enchiridion"
version = "0.1.0"
description = "Cross-harness AI coding-assistant configuration manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
enchiridion = "enchiridion.cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6",
    "pre-commit>=4.6",
    "pyright>=1.1.410",
    "pytest>=8.0",
    "ruff>=0.15.16",
]

[tool.hatch.build.targets.wheel]
packages = ["enchiridion"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH", "PT", "S", "D"]

# Allow fixed argument vectors and portable executable names
# Skip docstrings on magic methods and constructors
ignore = ["S603", "S607", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]

# Allow assertions and behavior-first names in test modules
"tests/**/*.py" = ["S101", "D"]

# Apply the same test relaxations to the rule exemplar
"shared/rules/**/examples/test_*.py" = ["S101", "D"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["enchiridion"]
